# Deploy the viewer to GitHub Pages.
#
# The site is a pure static Vite build. The generated data (`public/data`) and
# the referenced art (`public/img`) are committed, because the game archives they
# come from are not tracked — a CI checkout has no gfx pack and no locale tables,
# so `npm run data` cannot run here. `npm run build:pages` therefore just builds
# the app; see docs/deployment.md for how the assets are refreshed locally.
#
# One-time setup: Settings → Pages → Build and deployment → Source = GitHub
# Actions. (The workflow also tries to enable Pages itself.)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; only keep the latest queued run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modern_tome_viewer/package-lock.json

      - name: Install dependencies
        working-directory: modern_tome_viewer
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build the site
        working-directory: modern_tome_viewer
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: modern_tome_viewer/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
